<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomodachi Dream Life</title>
<meta name="description" content="Tomodachi Dream Life — your guide to the Tomodachi Life world.">
<link rel="canonical" href="https://tomodachilife-rom.com/">
<meta name="theme-color" content="#ffd43b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#fffdf7;--surface:#fff;--surface-2:#fff8e6;--text:#1b1d26;--muted:#5c6070;
  --line:#ece6d6;--line-strong:#ddd4bd;
  --brand:#ff9f1c;--brand-ink:#9a5600;--brand-soft:#fff3dd;
  --cta:#ff6b35;--cta-hover:#ef5a24;--cta-text:#fff;
  --header-h:68px;--maxw:1140px;--radius:12px;
  --shadow-sm:0 1px 2px rgba(27,29,38,.06);
  --shadow-md:0 4px 16px rgba(27,29,38,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161c;--surface:#1b1e26;--surface-2:#232733;--text:#f0f1f5;--muted:#a6abbd;
  --line:#2c313d;--line-strong:#3b4150;
  --brand:#ffc14d;--brand-ink:#ffd98a;--brand-soft:#2a2316;
  --cta:#ff7847;--cta-hover:#ff8d63;--cta-text:#1b1d26;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#14161c;--surface:#1b1e26;--surface-2:#232733;--text:#f0f1f5;--muted:#a6abbd;
  --line:#2c313d;--line-strong:#3b4150;
  --brand:#ffc14d;--brand-ink:#ffd98a;--brand-soft:#2a2316;
  --cta:#ff7847;--cta-hover:#ff8d63;--cta-text:#1b1d26;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",ui-sans-serif,system-ui,-apple-system,"Segoe UI",
    Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.65;text-wrap:pretty;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--cta);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:60;background:var(--surface);color:var(--text);
  padding:10px 16px;border-radius:8px;box-shadow:var(--shadow-md);text-decoration:none}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
}
@supports not (backdrop-filter:blur(1px)){.site-header{background:var(--surface)}}
.site-header .wrap{display:flex;align-items:center;gap:14px;height:var(--header-h)}

/* Brand ----------------------------------------------------- */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
  flex:0 0 auto;margin-right:auto;border-radius:8px}
.brand img{display:block;height:40px;width:auto;max-width:210px;object-fit:contain}
@media (max-width:420px){.brand img{height:34px;max-width:150px}}

/* Primary nav ----------------------------------------------- */
.nav ul{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
.nav a{
  display:block;padding:9px 13px;border-radius:9px;text-decoration:none;
  color:var(--muted);font-size:.94rem;font-weight:600;white-space:nowrap;
  transition:color .15s,background-color .15s;
}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--brand-ink);background:var(--brand-soft)}

/* CTA -------------------------------------------------------- */
.cta{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  background:var(--cta);color:var(--cta-text);font-weight:700;font-size:.94rem;
  padding:10px 20px;border-radius:999px;text-decoration:none;white-space:nowrap;
  box-shadow:var(--shadow-sm);transition:background-color .15s,transform .12s,box-shadow .15s;
}
.cta:hover{background:var(--cta-hover);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.cta:active{transform:translateY(0)}
.cta svg{flex:none}

/* Hamburger (hidden on desktop, shown via JS/CSS on mobile) --- */
.nav-toggle{
  display:none;flex:0 0 auto;width:42px;height:42px;padding:0;
  align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--line-strong);border-radius:10px;
  color:var(--text);cursor:pointer;
}
.nav-toggle:hover{background:var(--surface-2)}
.nav-toggle .bar{transition:transform .2s ease,opacity .15s ease;transform-origin:center}
.nav-toggle[aria-expanded="true"] .bar-1{transform:translateY(6px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] .bar-2{opacity:0}
.nav-toggle[aria-expanded="true"] .bar-3{transform:translateY(-6px) rotate(-45deg)}

/* --- Mobile layout ----------------------------------------- */
@media (max-width:860px){
  :root{--header-h:62px}
  .site-header .wrap{gap:10px}
  .nav-toggle{display:flex}
  .nav{
    position:absolute;left:0;right:0;top:var(--header-h);
    background:var(--surface);border-bottom:1px solid var(--line);
    box-shadow:var(--shadow-md);padding:8px 20px 16px;
  }
  .nav ul{flex-direction:column;align-items:stretch;gap:2px}
  .nav a{padding:12px 14px;font-size:1rem}
  /* Closed state applies ONLY when JS is present (html.js), so the menu
     stays reachable with JavaScript disabled. */
  .js .nav[hidden]{display:none}
  .cta{padding:9px 16px;font-size:.88rem}
}
@media (max-width:420px){
  .cta .cta-label-long{display:none}
}

/* ============================================================
   PLACEHOLDER (hero + rest of page come next)
   ============================================================ */
.placeholder{padding:72px 0;text-align:center;color:var(--muted)}
.placeholder h1{font-size:clamp(1.6rem,4.5vw,2.2rem);color:var(--text);margin:0 0 .4em;letter-spacing:-.02em}
.placeholder p{margin:0 auto;max-width:48ch}
.placeholder .box{margin-top:32px;border:2px dashed var(--line-strong);border-radius:16px;
  padding:56px 24px;background:var(--surface-2);font-weight:600}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- ============================================================
     SITE HEADER
     ============================================================ -->
<header class="site-header">
  <div class="wrap">

    <a class="brand" href="/" aria-label="Tomodachi Dream Life — home">
      <img src="/assets/logo.webp" alt="Tomodachi Dream Life" height="40" decoding="async">
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
      <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Menu</span>
      <svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line class="bar bar-1" x1="1" y1="3"  x2="21" y2="3"/>
        <line class="bar bar-2" x1="1" y1="9"  x2="21" y2="9"/>
        <line class="bar bar-3" x1="1" y1="15" x2="21" y2="15"/>
      </svg>
    </button>

    <nav id="primary-nav" class="nav" aria-label="Primary">
      <ul>
        <li><a href="/" aria-current="page">Home</a></li>
        <li><a href="#about">About the Game</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#guides">Guides</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </nav>

    <a class="cta" href="#get-it-now">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <path d="M8 0 9.9 5.2 15.5 5.4 11.1 8.9 12.6 14.3 8 11.1 3.4 14.3 4.9 8.9.5 5.4 6.1 5.2z"/>
      </svg>
      <span>Get It<span class="cta-label-long"> Now</span></span>
    </a>

  </div>
</header>

<main id="main">
  <div class="wrap placeholder">
    <h1>Header is in place</h1>
    <p>The hero banner goes here next, then the rest of the homepage, section by section.</p>
    <div class="box">Hero banner — coming next</div>
  </div>
</main>

<script>
/* Progressive enhancement: without JS the nav stays visible and usable. */
document.documentElement.className += " js";
(function () {
  var btn = document.querySelector(".nav-toggle");
  var nav = document.getElementById("primary-nav");
  var mq  = window.matchMedia("(max-width:860px)");

  function apply() {
    if (mq.matches) { nav.hidden = true; btn.setAttribute("aria-expanded", "false"); }
    else { nav.hidden = false; btn.setAttribute("aria-expanded", "false"); }
  }
  apply();
  mq.addEventListener("change", apply);

  btn.addEventListener("click", function () {
    var open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", String(!open));
    nav.hidden = open;
  });

  /* Close after tapping a link, and on Escape. */
  nav.addEventListener("click", function (e) {
    if (e.target.closest("a") && mq.matches) {
      nav.hidden = true; btn.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && mq.matches && !nav.hidden) {
      nav.hidden = true; btn.setAttribute("aria-expanded", "false"); btn.focus();
    }
  });
})();
</script>
</body>
</html>
